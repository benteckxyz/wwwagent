<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to my workspace</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d0f12;
      color: #f4f1ea;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(720px, 100%); }
    .mark { width: 42px; height: 42px; margin-bottom: 64px; border: 1px solid #77736b; border-radius: 50%; position: relative; }
    .mark::after { content: ""; position: absolute; width: 8px; height: 8px; right: 7px; top: 7px; background: #d6ff55; border-radius: 50%; }
    h1 { max-width: 650px; margin: 0; font-size: clamp(3rem, 9vw, 7rem); font-weight: 500; letter-spacing: -.07em; line-height: .95; }
    p { margin: 30px 0 0; color: #aaa69d; font-size: 1rem; letter-spacing: .02em; }
    footer { margin-top: 100px; display: flex; justify-content: space-between; color: #77736b; font-size: .78rem; border-top: 1px solid #292c31; padding-top: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Welcome to<br>my workspace.</h1>
    <p>A quiet place for ideas, experiments, and things worth building.</p>
    <footer><span>WWWAGENT</span><span>EST. 2026</span></footer>
  </main>
</body>
</html>
