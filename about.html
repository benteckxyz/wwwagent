<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About · My Workspace</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d0f12;
      color: #f4f1ea;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(720px, 100%); }
    a { color: #d6ff55; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .eyebrow { color: #77736b; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 18px 0; font-size: clamp(3rem, 9vw, 6rem); font-weight: 500; letter-spacing: -.07em; line-height: .95; }
    p { max-width: 560px; color: #aaa69d; font-size: 1.08rem; line-height: 1.7; }
    .back { display: inline-block; margin-top: 28px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">About this space</div>
    <h1>Ideas in<br>progress.</h1>
    <p>This is a small corner of the internet for experiments, notes, and things worth building.</p>
    <a class="back" href="./">← Back to workspace</a>
  </main>
</body>
</html>
